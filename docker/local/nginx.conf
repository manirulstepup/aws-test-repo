# Mounted read-only at /etc/nginx/conf.d/default.conf in the `nginx` service.
#
# Vite is NOT proxied through here. `npm run dev` publishes public/hot and the
# browser loads assets straight from the vite container on its own host port.

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Keep in step with upload_max_filesize/post_max_size in docker/local/php.ini.
    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Matches max_execution_time in docker/local/php.ini.
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
