; Mounted read-only at /usr/local/etc/php/conf.d/zz-local.ini.
; The `zz-` prefix matters: conf.d files load alphabetically, so this one lands
; after docker-php-ext-*.ini and can override what those set (xdebug included).

memory_limit = 512M
max_execution_time = 300
max_input_vars = 5000

; Keep in step with `client_max_body_size` in docker/local/nginx.conf.
upload_max_filesize = 64M
post_max_size = 64M

; Pick up edited PHP files immediately; the project root is a bind mount.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Set XDEBUG_MODE=debug in .env and restart `app` to enable it — xdebug reads
; the environment itself, so nothing here needs to change.
xdebug.mode = off
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
