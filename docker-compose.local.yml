# AinPath — local development.
#
# Standalone stack: its own network, MySQL and Mailpit, sharing nothing with
# inventory / LLB Logo-*. Host ports live in 8030-8034, clear of inventory
# (8000/5173/5432/6379/1025/8025/8080) and the LLB Logo-* repos (8011-8027).
#
#   app        php-fpm 8.4 + Node 22, reached by nginx on :9000 (not published)
#   nginx      HTTP        :8030   Inertia/React UI + /api
#   queue      php artisan queue:work
#   scheduler  php artisan schedule:work
#   vite       npm run dev         HMR :8031
#   mysql      MySQL 8.4   :8032
#   mailpit    SMTP :8033, dashboard :8034
#
# No Redis: cache, sessions and queues all run on the database.
#
#   cp .env.docker.example .env          # first time only
#   docker compose build                 # after editing docker/local/Dockerfile
#   docker compose up -d
#   docker compose exec app composer install
#   docker compose exec app php artisan key:generate
#   docker compose exec app php artisan migrate --seed
#   docker compose exec app php artisan storage:link
#   docker compose logs -f app nginx queue scheduler
#
# NEVER `docker compose down -v` — `-v` deletes llb-pdf_mysql-data, i.e. the
# entire local database.

# Pinned so volume names stay `llb-pdf_*` whichever directory the stack is
# brought up from. Changing this orphans the existing mysql-data volume.
name: llb-pdf

x-app: &app
  build:
    context: .
    dockerfile: docker/local/Dockerfile
    args:
      UID: "${UID:-1000}"
      GID: "${GID:-1000}"
  image: llb-pdf-local
  restart: unless-stopped
  working_dir: /var/www/html
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    XDEBUG_MODE: "${XDEBUG_MODE:-off}"
    XDEBUG_CONFIG: "${XDEBUG_CONFIG:-client_host=host.docker.internal}"
  volumes:
    - ".:/var/www/html"
    - "./docker/local/php.ini:/usr/local/etc/php/conf.d/zz-local.ini:ro"
    - "composer-cache:/home/www/.composer"
    - "npm-cache:/home/www/.npm"
  depends_on:
    mysql:
      condition: service_healthy
    mailpit:
      condition: service_started

services:
  app:
    <<: *app

  nginx:
    image: "nginx:alpine"
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8030}:80"
    volumes:
      # The project root is mounted so nginx can serve public/ directly,
      # including the public/storage symlink from `artisan storage:link`.
      - ".:/var/www/html"
      - "./docker/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on:
      - app

  # Every queued job in the app rides the default queue, so a bare
  # `queue:work` drains all of them — CSV imports included.
  queue:
    <<: *app
    command:
      - php
      - artisan
      - queue:work
      - --tries=1
      - --timeout=900
      - --sleep=1
    # Let an in-flight import use its full 900s timeout before docker kills it.
    stop_signal: SIGTERM
    stop_grace_period: 910s

  # routes/console.php runs payment:create-reminders once a day, which is what
  # chases clients about an upcoming or overdue payment. `schedule:work`
  # is the long-running equivalent of the production cron entry — no crontab
  # inside the image, and it survives a container restart on its own.
  scheduler:
    <<: *app
    command:
      - php
      - artisan
      - schedule:work
    # The reconciler writes to both databases, so let the tick it is in the
    # middle of finish rather than killing it between them.
    stop_signal: SIGTERM
    stop_grace_period: 70s

  # The dev server binds 0.0.0.0 and tells the browser `localhost:<VITE_PORT>`
  # (vite.config.js), so the port is published 1:1 — HMR would not connect
  # through a remapped one.
  vite:
    <<: *app
    environment:
      VITE_PORT: "${VITE_PORT:-8031}"
      # Docker Desktop bind mounts do not forward host filesystem events
      # to inotify reliably, so the watcher has to poll or HMR goes quiet.
      VITE_USE_POLLING: "${VITE_USE_POLLING:-true}"
    ports:
      - "${VITE_PORT:-8031}:${VITE_PORT:-8031}"
    # node_modules lives on the bind mount; install it on first boot so a
    # fresh clone does not crash-loop on a missing vite binary. Always let
    # THIS container run the install: esbuild and rollup ship per-platform
    # native binaries, and an `npm install` run on the macOS host swaps
    # @esbuild/linux-arm64 for @esbuild/darwin-arm64 and the container
    # stops booting.
    command:
      [
        "sh",
        "-c",
        "[ -d node_modules ] && [ -x node_modules/.bin/vite ] || npm install; exec npm run dev",
      ]

  mysql:
    image: "mysql:8.4"
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-8032}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      # Do NOT rename this volume. Compose does not migrate data on a
      # rename — it creates an empty one and orphans the old. MYSQL_*
      # only apply on FIRST init, so changing DB_USERNAME/DB_PASSWORD/
      # DB_DATABASE later just breaks authentication.
      - "mysql-data:/var/lib/mysql"
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - "-h"
        - "127.0.0.1"
        - "-u"
        - "${DB_USERNAME}"
        - "-p${DB_PASSWORD:-secret}"
      interval: 5s
      retries: 10
      timeout: 5s

  mailpit:
    image: "axllent/mailpit:latest"
    restart: unless-stopped
    ports:
      - "${FORWARD_MAILPIT_PORT:-8033}:1025"
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8034}:8025"

networks:
  default:
    name: llb-pdf
    driver: bridge

volumes:
  mysql-data:
    driver: local
  composer-cache:
    driver: local
  npm-cache:
    driver: local
